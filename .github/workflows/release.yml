name: Release

on:
  push:
    tags:
      # 商店要求 Release tag 与 manifest version 完全一致，发布用裸版本号；
      # v* 保留给沿用旧习惯的发布
      - '[0-9]*.[0-9]*.[0-9]*'
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify manifest version matches tag
        run: |
          node -e "
            const fs = require('fs');
            const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
            const tag = process.env.GITHUB_REF_NAME.replace(/^v/, '');
            if (manifest.version !== tag) {
              console.error(\`manifest.json version (\${manifest.version}) does not match tag (\${tag})\`);
              process.exit(1);
            }
            console.log(\`Version check passed: \${manifest.version}\`);
          "

      - name: Test & Build
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run build

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            styles.css

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            main.js
            manifest.json
            styles.css
